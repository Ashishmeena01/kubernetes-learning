apiVersion: apps/v1
kind: Deployment
metadata:
  name: frotend-todo
  labels:
    app: app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: app

  template:
    metadata:
      labels:
        app: app

    spec:
      containers:
        - name: app
          image: frontend:v3
          imagePullPolicy: Never
          ports:
            - containerPort: 80